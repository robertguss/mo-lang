# Repo-root pytest configuration.
#
# Hundreds of frozen copies of harness test files live under archived evidence
# snapshot trees (toolchain/harness/executor/recovery/evidence/<run>/sources/ and
# audit/evidence/<date>/.../sources/). They are artifacts of past runs, not an
# active suite: bare `pytest` from the root must never walk them.
#
#   uv run --project tools/claim-check pytest          # both active Python suites
#   uv run --project tools/claim-check pytest --cov    # with coverage (.coveragerc)
#
# The harness's own runner is a unittest script; measure it with
#   uv run --python 3.12 --with coverage coverage run toolchain/harness/executor/recovery/local_suite.py
#   uv run --python 3.12 --with coverage coverage report
[pytest]
testpaths =
    toolchain/harness/executor/recovery
    tools/claim-check/tests
norecursedirs =
    evidence
    audit
    */evidence/*
    */audit/*
    .*
    *.egg
    build
    dist
    node_modules
    venv
    .venv
    zig-cache
    zig-out
    .zig-cache
    mo-wiki
    site
    examples
    experiments
