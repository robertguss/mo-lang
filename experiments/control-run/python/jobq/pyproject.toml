[project]
name = "jobq"
version = "0.1.0"
description = "A durable job queue with an HTTP API"
authors = [
    { name = "Robert Guss", email = "robertguss@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
jobq = "jobq.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "bench"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF", "PL", "S", "TRY", "C4"]
ignore = ["PLR2004", "PLR0911", "TRY003", "S101", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S311", "S105", "S106", "S107"]
"bench/*" = ["S311"]
