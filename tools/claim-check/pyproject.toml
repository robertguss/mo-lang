[project]
name = "claim-check"
version = "0.1.0"
description = "Triage worker report claims against raw evidence with TypeSafe (a lead tool; never acceptance)"
readme = "README.md"
authors = [
    { name = "Robert Guss", email = "robertguss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.5.7",
]

[project.scripts]
claim-check = "claim_check:main"
claim-check-calibrate = "claim_check.calibrate:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "evidence",
    "audit",
    ".*",
    "*.egg",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "zig-cache",
    "zig-out",
    ".zig-cache",
]
# Coverage is opt-in: `uv run pytest --cov` (report settings below apply).

[tool.coverage.run]
source = ["src/claim_check"]
omit = ["*/evidence/*", "*/audit/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
